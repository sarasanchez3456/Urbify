# ═══════════════════════════════════════════════════════════════════
#  URBIFY – Pipeline de Integración Continua (CI)
#  GitHub Actions | Ficha SENA 3223877 – ADSO
#  Este workflow se ejecuta automáticamente con cada push o PR a main
# ═══════════════════════════════════════════════════════════════════

name: Urbify CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Validación del Backend (Node.js)
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: "🔍 Backend – Lint & Build Check"
    runs-on: ubuntu-latest

    # MySQL real para las pruebas de integración (no se simula nada: reservas, transacciones, claves foráneas...).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: "📥 Clonar el repositorio"
        uses: actions/checkout@v4

      - name: "⚙️ Configurar Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "📦 Instalar dependencias del backend"
        run: npm ci
        working-directory: ./backend

      - name: "🧹 Lint del backend (ESLint)"
        # Un error de lint bloquea la integración; las advertencias se muestran pero no bloquean.
        run: npm run lint
        working-directory: ./backend

      - name: "✅ Verificar que el servidor arranca correctamente"
        run: |
          # Creamos un .env temporal con valores de prueba
          echo "PORT=4000" > .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=test_password" >> .env
          echo "DB_NAME=urbify_db" >> .env
          echo "JWT_SECRET=ci_test_secret_key" >> .env
          echo "JWT_EXPIRES_IN=7d" >> .env
          # Verificamos que el archivo de entrada existe y la sintaxis es válida
          node --check src/index.js
          echo "✅ Sintaxis del backend válida"
        working-directory: ./backend

      - name: "📜 Validar el contrato de la API (docs/openapi.yaml)"
        # Un error en el contrato (YAML inválido, propiedades mal escritas, referencias rotas) hace fallar el CI.
        # Las advertencias de estilo (por ejemplo, operaciones sin operationId) no lo bloquean.
        run: npx --yes @redocly/cli@2.79.0 lint docs/openapi.yaml --extends minimal

      - name: "🧪 Pruebas unitarias del backend"
        run: npm test
        working-directory: ./backend

      - name: "🧪 Pruebas de integración del backend (MySQL real)"
        # Un fallo de autorización, privacidad, reservas, historial, auditoría o migraciones hace fallar el CI.
        # La base de pruebas (urbify_test) se crea desde cero con config/schema.sql en cada ejecución.
        run: npm run test:integration
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Validación del Frontend (React + Vite)
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: "🎨 Frontend – Install & Build"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Clonar el repositorio"
        uses: actions/checkout@v4

      - name: "⚙️ Configurar Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Instalar dependencias del frontend"
        run: npm ci
        working-directory: ./frontend

      - name: "🧹 Lint del frontend (ESLint)"
        # Un error de lint bloquea la integración; las advertencias se muestran pero no bloquean.
        run: npm run lint
        working-directory: ./frontend

      - name: "🧪 Pruebas del frontend (Vitest)"
        # Sesión, Axios, AuthContext, rutas protegidas y formularios (login, registro, código, ofrecer servicios). Un fallo bloquea el CI.
        run: npm test
        working-directory: ./frontend

      - name: "🏗️ Compilar el frontend con Vite (build de producción)"
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:4000/api

      - name: "✅ Verificar que la carpeta dist fue generada"
        run: |
          if [ -d "frontend/dist" ]; then
            echo "✅ Build exitoso – carpeta dist generada"
            ls -la frontend/dist/
          else
            echo "❌ ERROR: La carpeta dist no existe"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Validación de la infraestructura Docker
  # Se ejecuta solo si los jobs anteriores pasan
  # ─────────────────────────────────────────────────────────────
  docker-ci:
    name: "🐳 Docker – Compose Validation"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]   # Espera que ambos jobs pasen

    steps:
      - name: "📥 Clonar el repositorio"
        uses: actions/checkout@v4

      - name: "🔍 Validar sintaxis del docker-compose.yml"
        run: docker compose config
        env:
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci_test_jwt_secret

      - name: "📋 Resumen de la infraestructura"
        run: |
          echo "════════════════════════════════════"
          echo "  URBIFY – Infraestructura validada"
          echo "════════════════════════════════════"
          docker compose config --services
          echo "✅ Todos los servicios están correctamente definidos"
        env:
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci_test_jwt_secret

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Despliegue automático en Vercel (CD)
  # Solo se ejecuta al hacer push a main (o sea, al fusionar un PR) y únicamente si TODAS las pruebas pasaron.
  # Necesita el secreto VERCEL_TOKEN del repositorio (Settings → Secrets and variables → Actions).
  # Los identificadores del equipo y de los proyectos no son secretos.
  # Las migraciones de la base de datos NO se hacen aquí: si un cambio toca las tablas, se corre -Migrar aparte.
  # ─────────────────────────────────────────────────────────────
  desplegar:
    name: "🚀 Desplegar en Vercel"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Una publicación a la vez: si se fusionan dos PR seguidos, la segunda espera a la primera.
    concurrency:
      group: desplegar-vercel
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_QPeXNUGRBNeoqOBp9zZE0yc9
      API_URL: https://urbify-api.vercel.app
      WEB_URL: https://urbify-web-gamma.vercel.app

    steps:
      - name: "📥 Clonar el repositorio"
        uses: actions/checkout@v4

      - name: "🔑 Comprobar que existe el secreto VERCEL_TOKEN"
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN. Pide a quien administra el repositorio que lo cree (ver docs/DESPLIEGUE_VERCEL.md)."
            exit 1
          fi

      - name: "⚙️ Configurar Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "📦 Instalar la herramienta de Vercel"
        run: npm install -g vercel@latest

      - name: "🚀 Publicar la API (urbify-api)"
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        working-directory: ./backend
        env:
          VERCEL_PROJECT_ID: prj_xVJhNfIjdcww5xnPwTgQQDi0RA3A

      - name: "🚀 Publicar la página (urbify-web)"
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        working-directory: ./frontend
        env:
          VERCEL_PROJECT_ID: prj_s2Voayw7W8vgDzKO70TiFRBOyBoF

      - name: "✅ Comprobar que todo responde"
        run: |
          fallas=0
          for intento in 1 2 3 4 5; do
            estado=$(curl -s -o /tmp/health.json -w '%{http_code}' "$API_URL/api/health?deep=1" || true)
            if [ "$estado" = "200" ] && grep -q '"db":"ok"' /tmp/health.json; then break; fi
            sleep 5
          done
          [ "$estado" = "200" ] && grep -q '"db":"ok"' /tmp/health.json && echo "OK    API y base de datos" || { echo "::error::La API o la base de datos no responden ($estado)"; fallas=1; }
          cat=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/categorias" || true)
          [ "$cat" = "200" ] && echo "OK    La API lee categorías" || { echo "::error::La API no lee categorías ($cat)"; fallas=1; }
          web=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/" || true)
          [ "$web" = "200" ] && echo "OK    La página responde" || { echo "::error::La página no responde ($web)"; fallas=1; }
          exit $fallas
