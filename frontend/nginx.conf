server {
    listen 80;
    server_name localhost;

    # Cabeceras de seguridad. Los hosts externos son los que usa la app: fuentes de Google,
    # Leaflet (unpkg/cdnjs/raw.githubusercontent), teselas de OpenStreetMap y CARTO,
    # imagen del globo (r2.dev) y búsqueda de direcciones (Nominatim).
    # style-src 'unsafe-inline': React y Leaflet aplican estilos en línea.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://cdnjs.cloudflare.com https://raw.githubusercontent.com https://unpkg.com https://pub-940ccf6255b54fa799a9b01050e6c227.r2.dev; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Directorio donde están los archivos compilados de React
    root /usr/share/nginx/html;
    index index.html;

    # Regla más importante: para que React Router funcione.
    # Si alguien pide /dashboard, Nginx le sirve index.html
    # y React Router se encarga del resto internamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: todas las peticiones que empiecen con /api
    # se redirigen al contenedor del backend (usando su nombre DNS interno)
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        # IP y protocolo reales del cliente (la API los lee con TRUST_PROXY=1)
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Las cabeceras de seguridad de arriba (add_header) también se aplican a /api. El backend (helmet) envía
        # las suyas y quedarían duplicadas y contradictorias (X-Frame-Options SAMEORIGIN + DENY), así que se
        # descartan las del backend y queda un solo juego, el de Nginx.
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  Referrer-Policy;
    }
}
