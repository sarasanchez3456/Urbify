# ═══════════════════════════════════════════════════════════════════
#  URBIFY – Docker Compose
#  Orquesta los 3 servicios: base de datos, backend y frontend
#  Uso: docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════

# Nombre fijo del proyecto: garantiza que los volúmenes se llamen
# "urbify_*" sin importar desde qué carpeta se ejecute docker compose.
# Así se reutiliza el volumen urbify_mysql_data con los datos ya existentes.
name: urbify

services:

  # ─────────────────────────────────────────────────────────────
  # SERVICIO 1: Base de datos MySQL 8.0
  # ─────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: urbify-db
    restart: unless-stopped
    environment:
      # Sin valor por defecto: define DB_PASSWORD en el .env de la raíz (ver .env.example)
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      MYSQL_DATABASE: urbify_db
    ports:
      # Solo accesible desde la propia máquina; el backend usa la red interna
      - "127.0.0.1:3306:3306"
    volumes:
      # Volumen nombrado: los datos sobreviven aunque el contenedor se borre
      - mysql_data:/var/lib/mysql
      # Script SQL que crea las tablas al arrancar por primera vez
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - urbify-red
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # SERVICIO 2: API REST – Node.js / Express
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbify-backend
    restart: unless-stopped
    environment:
      # production exige secretos reales; usa NODE_ENV=development en el .env para trabajar en local
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DB_HOST: db           # Nombre DNS interno en la red urbify-red
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      DB_NAME: urbify_db
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      JWT_EXPIRES_IN: 7d
      # Orígenes permitidos, separados por comas. En producción usa https.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-Urbify <notificaciones@urbify.app>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BODY_LIMIT: ${BODY_LIMIT:-100kb}
      # Nginx (servicio frontend) va delante de la API: 1 proxy de confianza
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    ports:
      # Solo la propia máquina: la web llega por Nginx (/api) y TRUST_PROXY=1 confía en ese proxy
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy   # Espera que MySQL esté listo
    networks:
      - urbify-red

  # ─────────────────────────────────────────────────────────────
  # SERVICIO 3: Frontend React + Nginx
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbify-frontend
    restart: unless-stopped
    ports:
      # La app queda disponible en http://localhost:80
      - "80:80"
    depends_on:
      - backend
    networks:
      - urbify-red

# ─────────────────────────────────────────────────────────────
# RED PRIVADA (bridge): comunicación interna por nombre de servicio
# ─────────────────────────────────────────────────────────────
networks:
  urbify-red:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# VOLUMEN NOMBRADO: persistencia de la base de datos
# Los datos de MySQL se guardan aquí aunque el contenedor se elimine
# ─────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
